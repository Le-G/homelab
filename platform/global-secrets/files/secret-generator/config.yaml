# ntfy
- name: ntfy-relay.auth
  data:
    - key: password
      length: 32
      special: true

# nextcloud postgres
- name: nextcloud.pgadminpassword
  data:
    - key: password
      length: 32
      special: true

# grafana
- name: grafana.admin
  data:
    - key: password
      length: 32
      special: true

# adguard
- name: adguard.admin
  data:
    - key: password
      length: 32
      special: true

# vaultwarden
- name: vaultwarden.admin
  data:
    - key: password
      length: 40
      special: true

# hermes dashboard
- name: hermes.dashboard
  data:
    - key: password
      length: 32
      special: true
    - key: session_secret
      length: 48
      special: false

# realestate hermes dashboard (separate from hermes.dashboard)
- name: realestate-hermes.dashboard
  data:
    - key: password
      length: 32
      special: true
    - key: session_secret
      length: 48
      special: false
