ingress-nginx:
  controller:
    # One replica per node, so losing a node doesn't take every site down.
    replicaCount: 2
    minAvailable: 1
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
                app.kubernetes.io/component: controller
    admissionWebhooks:
      timeoutSeconds: 30
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  tcp:
    1883: home-assistant/home-assistant:1883
    51413: jellyfin/jellyfin-transmission:51413
    6881: jellyfin/jellyfin-qbittorrent:6881
