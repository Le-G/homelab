apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: realestate-hermes-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: realestate-hermes-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: realestate-hermes.dashboard
        property: password
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: realestate-hermes.dashboard
        property: session_secret
