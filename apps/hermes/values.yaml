hermes-agent:
  fullnameOverride: hermes
  # Required by the chart schema. Real credentials come from hermes-secrets.
  env: {}
  extraEnv:
    - name: HERMES_DASHBOARD
      value: "1"
    - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      value: admin
  extraEnvFrom:
    - secretRef:
        name: hermes-secrets
  config:
    model:
      provider: xai
      default: grok-4.7
    terminal:
      backend: local
    web:
      backend: xai
    dashboard:
      public_url: https://hermes.le-g.dev
      # k3s default pod CIDR, which is where ingress-nginx runs.
      trusted_proxies:
        - 10.42.0.0/16
  persistence:
    enabled: true
    storageClass: longhorn
    size: 10Gi
  service:
    enabled: true
    type: ClusterIP
    port: 9119
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: hermes.le-g.dev
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: hermes-tls-certificate
        hosts:
          - hermes.le-g.dev
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  tests:
    enabled: false
