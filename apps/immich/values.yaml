immich:
  # Define hostname anchor at the top
  shared_config:
    hostname: &hostname immich.le-g.dev
    url: &url https://immich.le-g.dev

  # Pass DB config to subchart (accessible as .Values.db in subchart context)
  db:
    username: immich
    database: immich
    hostname: "immich-postgres"
    passwordSecret:
      name: immich-postgresql-secret
      key: postgres-password

  controllers:
    main:
      containers:
        main:
          env:
            REDIS_HOSTNAME: "{{ .Release.Name }}-redis-master"
            DB_HOSTNAME: "immich-postgres"
            DB_USERNAME: "{{ .Values.db.username }}"
            DB_DATABASE_NAME: "{{ .Values.db.database }}"
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.db.passwordSecret.name }}"
                  key: "{{ .Values.db.passwordSecret.key }}"
            IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

  immich:
    metrics:
      # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
      enabled: false
    persistence:
      # Main data store for all phAotos shared between different components.
      library:
        # Automatically creating the library volume is not supported by this chart
        # You have to specify an existing PVC to use
        existingClaim: immich-nas-pvc
    # configuration is immich-config.json converted to yaml
    # ref: https://immich.app/docs/install/config-file/

  # Running v3.0.1 against the official VectorChord Postgres (immich-postgres).
  server:
    # Configure persistence mounts for the server component
    # Mount the upload subdirectory from PVC to /usr/src/app/upload
    # Immich expects to find .immich file directly in /usr/src/app/upload/
    # and will create subdirectories (library, thumbs, profile, encoded-video) under upload/
    persistence:
      data:
        globalMounts:
          - path: /usr/src/app/upload
            subPath: upload
            readOnly: false
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.0.1
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                memory: 5Gi
            workingDir: /usr/src/app
            env:
              REDIS_HOSTNAME: "{{ .Release.Name }}-redis-master"
              DB_HOSTNAME: "immich-postgres"
              DB_USERNAME: "{{ .Values.db.username }}"
              DB_DATABASE_NAME: "{{ .Values.db.database }}"
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Values.db.passwordSecret.name }}"
                    key: "{{ .Values.db.passwordSecret.key }}"
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
    ingress:
      main:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
          external-dns.alpha.kubernetes.io/target: homelab-tunnel.le-g.dev
          external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
        hosts:
          - host: *hostname
            paths:
              - path: "/"
        tls:
          - secretName: immich-ingress-tls
            hosts:
              - *hostname
  machine-learning:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.0.1
            resources:
              requests:
                cpu: "1"
                memory: 1Gi
              limits:
                memory: 4Gi
# Postgres is now provided by templates/postgres.yaml (ghcr.io/immich-app/postgres,
# VectorChord). The Bitnami postgresql subchart has been removed from Chart.yaml.

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false



